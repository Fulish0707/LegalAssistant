# Pilot profile: same retrieval settings as local, new civil corpus only.
# Build civil-struct800-v1 before using this profile for search/chat.
corpus:
  version: civil-struct800-v1
embedding:
  model: bge-m3
  query_num_ctx: 1024
qdrant:
  mode: server
  url: http://localhost:6333
retrieval:
  corpora: [criminal-v1, civil-struct800-v1, administrative-v1, ip-v1]
  k_dense: 100
  k_sparse: 100
  k_fused: 100
  sparse_weight: 0.75
  leg_floor: 3
rerank:
  backend: cross_encoder
  device: cuda
  local_files_only: true
  dtype: float16
llm:
  model: qwen3:4b
  num_ctx: 8192
rag:
  context_neighbor_radius: 1
  context_neighbor_corpora: [civil-struct800-v1]
  max_evidence_chars: 1500
  max_context_chars: 7500
api:
  warmup: true
