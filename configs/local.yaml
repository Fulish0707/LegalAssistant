# Ubuntu host with an RTX 4060. Ollama serves both the LLM and the embedder.
embedding:
  model: bge-m3
llm:
  model: qwen3:4b
  
qdrant:
  mode: server
  url: http://localhost:6333

retrieval:
  corpora: [criminal-v1, civil-v1, administrative-v1, ip-v1]
  k_fused: 50
  # Measured on the ip-v1 200-case graded pool (docs/retrieval-diagnostics.md): equal weights cost
  # 0.096 Precision@10 against dense alone (95% CI [0.069, 0.122]); at 0.75 the hybrid matches dense
  # (+0.011, CI [-0.000, 0.022]), so sparse is kept as insurance for lexical queries, not for gain.
  sparse_weight: 0.75
