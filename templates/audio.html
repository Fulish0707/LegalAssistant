<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS_Agent - Audio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f6f7f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .function-bar .btn {
            margin-right: 0.5rem;
        }
        .audio-workspace {
            min-height: calc(100vh - 150px);
        }
        .output-box {
            resize: vertical;
        }
    </style>
</head>
<body>
    <header class="bg-light border-bottom py-3">
        <div class="container">
            <h1 class="h2 mb-3">PS_Agent Work Companion</h1>
            <div class="function-bar">
                <a href="chatbot.html" class="btn btn-outline-primary"><i class="bi bi-chat"></i> Chat</a>
                <a href="document.html" class="btn btn-outline-primary"><i class="bi bi-file-text"></i> Documents</a>
                <button class="btn btn-primary active"><i class="bi bi-mic"></i> Audio</button>
                <a href="statistics.html" class="btn btn-outline-primary"><i class="bi bi-bar-chart"></i> Statistics</a>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 py-4">
        <div class="container audio-workspace">
            <section class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Audio Notes</h2>
                    <div class="row g-3">
                        <div class="col-lg-6">
                            <label for="audioFileUpload" class="form-label">Upload audio</label>
                            <div class="input-group">
                                <input class="form-control" type="file" id="audioFileUpload" accept="audio/*">
                                <button class="btn btn-outline-secondary" type="button" id="summarizeUploadedAudioButton" disabled title="Summarize uploaded audio">
                                    <i class="bi bi-file-earmark-play"></i> Summarize File
                                </button>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <label class="form-label">Record audio</label>
                            <div>
                                <button class="btn btn-success" id="startRecordButton" title="Start recording"><i class="bi bi-mic-fill"></i> Start</button>
                                <button class="btn btn-danger ms-1" id="stopRecordButton" disabled title="Stop recording"><i class="bi bi-stop-fill"></i> Stop</button>
                                <button class="btn btn-info ms-1" type="button" id="summarizeRecordedAudioButton" disabled title="Summarize recorded audio">
                                    <i class="bi bi-soundwave"></i> Summarize Recording
                                </button>
                            </div>
                            <p id="recordingStatus" class="form-text mb-0">Allow microphone access to record audio.</p>
                        </div>
                    </div>

                    <hr>

                    <div id="summaryOutputLoading" class="text-center my-3 d-none">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mb-0">Summarizing...</p>
                    </div>

                    <div class="row g-3">
                        <div class="col-lg-6">
                            <label for="audioSummaryOutput" class="form-label">Summary</label>
                            <textarea id="audioSummaryOutput" class="form-control output-box" rows="14" readonly placeholder="Audio summary will appear here."></textarea>
                        </div>
                        <div class="col-lg-6">
                            <label for="audioTranscriptOutput" class="form-label">Transcript</label>
                            <textarea id="audioTranscriptOutput" class="form-control output-box" rows="14" readonly placeholder="Transcript will appear here."></textarea>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audioFileUpload = document.getElementById('audioFileUpload');
            const summarizeUploadedAudioButton = document.getElementById('summarizeUploadedAudioButton');
            const startRecordButton = document.getElementById('startRecordButton');
            const stopRecordButton = document.getElementById('stopRecordButton');
            const recordingStatus = document.getElementById('recordingStatus');
            const summarizeRecordedAudioButton = document.getElementById('summarizeRecordedAudioButton');
            const audioSummaryOutput = document.getElementById('audioSummaryOutput');
            const audioTranscriptOutput = document.getElementById('audioTranscriptOutput');
            const summaryOutputLoading = document.getElementById('summaryOutputLoading');

            let mediaRecorder;
            let audioChunks = [];
            let recordedAudioBlob = null;

            audioFileUpload.addEventListener('change', () => {
                summarizeUploadedAudioButton.disabled = audioFileUpload.files.length === 0;
                audioSummaryOutput.value = '';
                audioTranscriptOutput.value = '';
                recordedAudioBlob = null;
                summarizeRecordedAudioButton.disabled = true;
            });

            summarizeUploadedAudioButton.addEventListener('click', async () => {
                const file = audioFileUpload.files[0];
                if (!file) {
                    alert('Choose an audio file first.');
                    return;
                }
                await processAndSummarizeAudio(file, 'file');
            });

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                startRecordButton.addEventListener('click', async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                        audioChunks = [];
                        recordedAudioBlob = null;

                        mediaRecorder.ondataavailable = event => {
                            audioChunks.push(event.data);
                        };

                        mediaRecorder.onstop = () => {
                            recordedAudioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                            audioChunks = [];
                            summarizeRecordedAudioButton.disabled = false;
                            recordingStatus.textContent = 'Recording complete. Summarize when ready.';
                            stream.getTracks().forEach(track => track.stop());
                        };

                        mediaRecorder.start();
                        startRecordButton.disabled = true;
                        stopRecordButton.disabled = false;
                        summarizeRecordedAudioButton.disabled = true;
                        audioFileUpload.disabled = true;
                        summarizeUploadedAudioButton.disabled = true;
                        recordingStatus.textContent = 'Recording...';
                        audioSummaryOutput.value = '';
                        audioTranscriptOutput.value = '';
                        audioFileUpload.value = '';
                    } catch (err) {
                        recordingStatus.textContent = `Microphone error: ${err.message}`;
                    }
                });

                stopRecordButton.addEventListener('click', () => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        startRecordButton.disabled = false;
                        stopRecordButton.disabled = true;
                        audioFileUpload.disabled = false;
                    }
                });

                summarizeRecordedAudioButton.addEventListener('click', async () => {
                    if (!recordedAudioBlob) {
                        alert('Record audio before summarizing.');
                        return;
                    }
                    await processAndSummarizeAudio(recordedAudioBlob, 'blob');
                });
            } else {
                startRecordButton.disabled = true;
                stopRecordButton.disabled = true;
                recordingStatus.textContent = 'This browser does not support audio recording.';
            }

            async function processAndSummarizeAudio(audioData, type) {
                audioSummaryOutput.value = '';
                audioTranscriptOutput.value = '';
                summaryOutputLoading.classList.remove('d-none');
                summarizeUploadedAudioButton.disabled = true;
                summarizeRecordedAudioButton.disabled = true;

                const formData = new FormData();
                let endpoint = '';
                let fileNameForBlob = 'recorded_audio.webm';

                if (type === 'file') {
                    formData.append('audio_file', audioData, audioData.name);
                    endpoint = '/transcribe_and_summarize_audio_file';
                } else {
                    if (audioData.type && audioData.type.includes('wav')) {
                        fileNameForBlob = 'recorded_audio.wav';
                    }
                    formData.append('audio_blob', audioData, fileNameForBlob);
                    endpoint = '/transcribe_and_summarize_audio_blob';
                }

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        body: formData,
                    });
                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || result.detail || response.statusText);
                    }

                    if (result.error) {
                        audioSummaryOutput.value = `Error: ${result.error}`;
                        audioTranscriptOutput.value = result.transcript || 'Transcript unavailable.';
                    } else {
                        audioSummaryOutput.value = result.summary || 'Summary unavailable.';
                        audioTranscriptOutput.value = result.transcript || 'Transcript unavailable.';
                    }
                } catch (error) {
                    audioSummaryOutput.value = `Audio processing failed: ${error.message}`;
                } finally {
                    summaryOutputLoading.classList.add('d-none');
                    if (type === 'file' && audioFileUpload.files.length > 0) {
                        summarizeUploadedAudioButton.disabled = false;
                    }
                    if (type === 'blob') {
                        summarizeRecordedAudioButton.disabled = true;
                    }
                }
            }
        });
    </script>
</body>
</html>
