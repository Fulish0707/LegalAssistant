<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 도우미 - 음성</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 150px);
            flex-grow: 1;
        }
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 1rem;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            min-height: 0;
        }
        .chat-input {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 0.5rem;
            border-top: 1px solid #dee2e6;
        }
        .message {
            max-width: 85%;
            margin-bottom: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .thoughts-log {
            max-height: 150px;
            overflow-y: auto;
            padding: 0.75rem;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
        }
        .saving-indicator.saving {
            opacity: 1;
        }
        .function-bar .btn {
            margin-right: 0.5rem;
        }
        .draft-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 300px);
            flex-grow: 1;
        }
        .draft-container textarea {
            flex-grow: 1;
            min-height: 0;
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header class="bg-light border-bottom py-3">
        <div class="container">
            <h1 class="h2 mb-3">무엇을 도와줄까?</h1>
            <div class="function-bar">
                <a href="chatbot.html" class="btn btn-outline-primary"><i class="bi bi-chat"></i> 작성</a>
                <a href="document.html" class="btn btn-outline-primary"><i class="bi bi-file-text"></i> 문서</a>
                <button class="btn btn-primary active"><i class="bi bi-mic"></i> 음성</button>
                <a href="video.html" class="btn btn-outline-primary"><i class="bi bi-camera-reels"></i> 영상</a>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="flex-grow-1 py-4">
        <div class="container h-100 d-flex flex-column">
            <div class="row flex-grow-1">
                <div class="col-md-12 mb-4 d-flex flex-column">
                    <div class="card flex-grow-1" id="audio-content-area">
                        <div class="card-body d-flex flex-column">
                            <h2 class="card-title h5">음성 분석 및 요약</h2>
                            
                            <div class="row mb-3">
                                <div class="col-md-6 mb-3 mb-md-0"> <!-- Left column for Upload -->
                                    <h6>오디오 파일 선택:</h5>
                                    <div class="input-group">
                                        <input class="form-control" type="file" id="audioFileUpload" accept="audio/*">
                                        <button class="btn btn-outline-secondary" type="button" id="summarizeUploadedAudioButton" disabled title="업로드된 오디오 파일 요약 시작"><i class="bi bi-file-earmark-play"></i> 파일 요약</button>
                                    </div>
                                </div>
                                <div class="col-md-6"> <!-- Right column for Record -->
                                    <h6>실시간 녹음:</h5>
                                    <div class="mb-2"> <!-- Group for all recording related action buttons -->
                                        <button class="btn btn-success" id="startRecordButton" title="마이크 녹음 시작"><i class="bi bi-mic-fill"></i> 녹음 시작</button>
                                        <button class="btn btn-danger ms-1" id="stopRecordButton" disabled title="녹음 중지"><i class="bi bi-stop-fill"></i> 녹음 중지</button>
                                        <button class="btn btn-info ms-1" type="button" id="summarizeRecordedAudioButton" disabled title="녹음된 오디오 요약 시작"><i class="bi bi-soundwave"></i> 녹음 요약</button>
                                    </div>
                                    <p id="recordingStatus" class="form-text">마이크 권한을 허용해주세요.</p>
                                </div>
                            </div>
                            
                            <hr>
                            
                            <h3 class="h5 mt-3">요약 결과</h3>
                            <div id="summaryOutputLoading" class="text-center my-3 d-none">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p>요약 중입니다...</p>
                            </div>
                            <textarea id="audioSummaryOutput" class="form-control flex-grow-1" rows="10" readonly placeholder="오디오 요약이 여기에 표시됩니다..."></textarea>
                            
                            <h4 class="h6 mt-3">전체 스크립트 (참고용)</h4>
                            <textarea id="audioTranscriptOutput" class="form-control" rows="5" readonly placeholder="전체 스크립트가 여기에 표시됩니다..."></textarea>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Audio page loaded with new features. Layout updated.");

            const audioFileUpload = document.getElementById('audioFileUpload');
            const summarizeUploadedAudioButton = document.getElementById('summarizeUploadedAudioButton');
            
            const startRecordButton = document.getElementById('startRecordButton');
            const stopRecordButton = document.getElementById('stopRecordButton');
            const recordingStatus = document.getElementById('recordingStatus');
            const summarizeRecordedAudioButton = document.getElementById('summarizeRecordedAudioButton');

            const audioSummaryOutput = document.getElementById('audioSummaryOutput');
            const audioTranscriptOutput = document.getElementById('audioTranscriptOutput');
            const summaryOutputLoading = document.getElementById('summaryOutputLoading');

            let mediaRecorder;
            let audioChunks = [];
            let recordedAudioBlob = null;

            // File Upload Logic
            audioFileUpload.addEventListener('change', () => {
                if (audioFileUpload.files.length > 0) {
                    summarizeUploadedAudioButton.disabled = false;
                    audioSummaryOutput.value = ''; 
                    audioTranscriptOutput.value = '';
                    recordedAudioBlob = null; // Clear any previous recording
                    summarizeRecordedAudioButton.disabled = true;
                } else {
                    summarizeUploadedAudioButton.disabled = true;
                }
            });

            summarizeUploadedAudioButton.addEventListener('click', async () => {
                const file = audioFileUpload.files[0];
                if (!file) {
                    alert('요약할 오디오 파일을 선택해주세요.');
                    return;
                }
                await processAndSummarizeAudio(file, 'file');
            });

            // Recording Logic
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                console.log('getUserMedia supported.');
                startRecordButton.addEventListener('click', async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' }); // Explicitly try webm, server can convert
                        audioChunks = [];
                        recordedAudioBlob = null;

                        mediaRecorder.ondataavailable = event => {
                            audioChunks.push(event.data);
                        };

                        mediaRecorder.onstop = () => {
                            recordedAudioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                            audioChunks = [];
                            summarizeRecordedAudioButton.disabled = false;
                            recordingStatus.textContent = '녹음 완료. "녹음 요약" 버튼을 클릭하세요.';
                            stream.getTracks().forEach(track => track.stop()); // Clean up stream tracks
                        };
                        
                        mediaRecorder.start();
                        startRecordButton.disabled = true;
                        stopRecordButton.disabled = false;
                        summarizeRecordedAudioButton.disabled = true;
                        audioFileUpload.disabled = true; 
                        summarizeUploadedAudioButton.disabled = true;
                        recordingStatus.textContent = '녹음 중...';
                        audioSummaryOutput.value = ''; 
                        audioTranscriptOutput.value = '';
                        audioFileUpload.value = ''; // Clear file input

                    } catch (err) {
                        console.error('Error accessing microphone:', err);
                        recordingStatus.textContent = '마이크 접근 오류: ' + err.message;
                        alert('마이크에 접근할 수 없습니다. 권한을 확인해주세요.');
                    }
                });

                stopRecordButton.addEventListener('click', () => {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                        startRecordButton.disabled = false;
                        stopRecordButton.disabled = true;
                        audioFileUpload.disabled = false;
                    }
                });

                summarizeRecordedAudioButton.addEventListener('click', async () => {
                    if (!recordedAudioBlob) {
                        alert('요약할 녹음된 오디오가 없습니다.');
                        return;
                    }
                    await processAndSummarizeAudio(recordedAudioBlob, 'blob');
                });

            } else {
                console.error('getUserMedia not supported on your browser!');
                startRecordButton.disabled = true;
                stopRecordButton.disabled = true;
                recordingStatus.textContent = '브라우저가 오디오 녹음을 지원하지 않습니다.';
            }
            
            async function processAndSummarizeAudio(audioData, type) {
                audioSummaryOutput.value = '';
                audioTranscriptOutput.value = '';
                summaryOutputLoading.classList.remove('d-none');
                summarizeUploadedAudioButton.disabled = true;
                summarizeRecordedAudioButton.disabled = true;

                const formData = new FormData();
                let endpoint = '';
                let fileNameForBlob = 'recorded_audio.webm'; // Default to webm

                if (type === 'file') {
                    formData.append('audio_file', audioData, audioData.name);
                    endpoint = '/transcribe_and_summarize_audio_file';
                } else if (type === 'blob') {
                    if (audioData.type && audioData.type.includes('wav')){ // Check if blob is already wav
                        fileNameForBlob = 'recorded_audio.wav';
                    }
                    formData.append('audio_blob', audioData, fileNameForBlob);
                    endpoint = '/transcribe_and_summarize_audio_blob';
                } else {
                    alert('Unknown audio data type.');
                    summaryOutputLoading.classList.add('d-none');
                    return;
                }

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ detail: '서버 응답 처리 중 오류 발생' }));
                        throw new Error(`오디오 처리 실패 (HTTP ${response.status}): ${errorData.detail || response.statusText}`);
                    }

                    const result = await response.json();

                    if (result.error) {
                        audioSummaryOutput.value = `오류: ${result.error}`;
                        audioTranscriptOutput.value = result.transcript || '스크립트 생성 중 오류 발생';
                    } else {
                        audioSummaryOutput.value = result.summary || '요약 내용을 받지 못했습니다.';
                        audioTranscriptOutput.value = result.transcript || '스크립트 내용을 받지 못했습니다.';
                    }

                } catch (error) {
                    console.error('Error processing audio:', error);
                    audioSummaryOutput.value = `클라이언트 측 오류: ${error.message}`;
                } finally {
                    summaryOutputLoading.classList.add('d-none');
                    if (type === 'file' && audioFileUpload.files.length > 0) summarizeUploadedAudioButton.disabled = false;
                    // Keep summarizeRecordedAudioButton disabled after summarization until a new recording is made
                    if (type === 'blob') summarizeRecordedAudioButton.disabled = true; 
                }
            }
        });
    </script>
</body>
</html>
