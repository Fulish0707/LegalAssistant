<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS_Agent - Documents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f6f7f9;
            min-height: 100vh;
        }
        .function-bar .btn {
            margin-right: 0.5rem;
        }
        .workspace {
            min-height: calc(100vh - 150px);
        }
        .tool-panel,
        .output-panel {
            height: 100%;
        }
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.5rem;
        }
        .mode-button {
            min-height: 76px;
            text-align: left;
        }
        .mode-button .bi {
            font-size: 1.15rem;
            margin-right: 0.35rem;
        }
        .mode-button.active {
            border-color: #0d6efd;
            background: #e8f1ff;
            color: #084298;
        }
        #reportOutput {
            min-height: 430px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
        }
        #reportOutput table {
            width: 100%;
            border-collapse: collapse;
        }
        #reportOutput th,
        #reportOutput td {
            border: 1px solid #dee2e6;
            padding: 0.45rem;
        }
        .metadata {
            font-size: 0.85rem;
            color: #6c757d;
        }
        @media (max-width: 767.98px) {
            .mode-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="bg-light border-bottom py-3">
        <div class="container">
            <h1 class="h2 mb-3">PS_Agent Work Companion</h1>
            <div class="function-bar">
                <a href="chatbot.html" class="btn btn-outline-primary"><i class="bi bi-chat"></i> Chat</a>
                <button class="btn btn-primary active"><i class="bi bi-file-text"></i> Documents</button>
                <a href="audio.html" class="btn btn-outline-primary"><i class="bi bi-mic"></i> Audio</a>
                <a href="statistics.html" class="btn btn-outline-primary"><i class="bi bi-bar-chart"></i> Statistics</a>
            </div>
        </div>
    </header>

    <main class="py-4">
        <div class="container workspace">
            <div class="row g-3 h-100">
                <div class="col-lg-4">
                    <section class="card tool-panel">
                        <div class="card-body">
                            <h2 class="h5 mb-3">Document Workspace</h2>

                            <div class="mb-3">
                                <label for="fileUpload" class="form-label">Upload file</label>
                                <input class="form-control" type="file" id="fileUpload" accept=".pdf,.png,.jpg,.jpeg,.docx,.txt">
                                <div class="form-text">PDF, TXT, DOCX, PNG, JPG, JPEG</div>
                            </div>

                            <label class="form-label">Mode</label>
                            <div class="mode-grid mb-3" role="group" aria-label="Document analysis mode">
                                <button class="btn btn-outline-secondary mode-button active" type="button" data-mode="summary">
                                    <i class="bi bi-card-text"></i><strong>Summarize</strong>
                                    <div class="small">Key points and takeaways</div>
                                </button>
                                <button class="btn btn-outline-secondary mode-button" type="button" data-mode="report">
                                    <i class="bi bi-file-earmark-richtext"></i><strong>Write Report</strong>
                                    <div class="small">Business-ready structure</div>
                                </button>
                                <button class="btn btn-outline-secondary mode-button" type="button" data-mode="actions">
                                    <i class="bi bi-check2-square"></i><strong>Action Items</strong>
                                    <div class="small">Tasks, risks, next steps</div>
                                </button>
                                <button class="btn btn-outline-secondary mode-button" type="button" data-mode="qa">
                                    <i class="bi bi-question-circle"></i><strong>Ask Document</strong>
                                    <div class="small">Answer from file content</div>
                                </button>
                            </div>

                            <div class="mb-3 d-none" id="questionGroup">
                                <label for="documentQuestion" class="form-label">Question</label>
                                <textarea class="form-control" id="documentQuestion" rows="3" placeholder="Ask a question that should be answered from the uploaded document."></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="userInstructions" class="form-label">Extra instructions</label>
                                <textarea class="form-control" id="userInstructions" rows="4" placeholder="Optional: target audience, tone, output language, areas to focus on, or report format."></textarea>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="addToKnowledgeBase" checked>
                                <label class="form-check-label" for="addToKnowledgeBase">
                                    Save to chat knowledge base
                                </label>
                                <div class="form-text">Lets the main chat answer follow-up questions from this document.</div>
                            </div>

                            <button class="btn btn-primary w-100" id="generateReportButton">
                                <i class="bi bi-stars"></i> Analyze Document
                            </button>
                        </div>
                    </section>
                </div>

                <div class="col-lg-8">
                    <section class="card output-panel">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
                                <div>
                                    <h2 class="h5 mb-1" id="outputTitle">Document output</h2>
                                    <div class="metadata" id="outputMeta">Upload a document and choose a mode.</div>
                                </div>
                                <button class="btn btn-success btn-sm d-none" id="downloadReportButton">
                                    <i class="bi bi-download"></i> Download HTML
                                </button>
                            </div>
                            <div id="reportOutput" class="flex-grow-1 p-3">
                                <p class="text-muted mb-0">Your summary, report, action list, or document answer will appear here.</p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileUpload = document.getElementById('fileUpload');
            const userInstructionsInput = document.getElementById('userInstructions');
            const documentQuestion = document.getElementById('documentQuestion');
            const questionGroup = document.getElementById('questionGroup');
            const addToKnowledgeBase = document.getElementById('addToKnowledgeBase');
            const generateReportButton = document.getElementById('generateReportButton');
            const reportOutput = document.getElementById('reportOutput');
            const outputTitle = document.getElementById('outputTitle');
            const outputMeta = document.getElementById('outputMeta');
            const downloadReportButton = document.getElementById('downloadReportButton');
            const modeButtons = Array.from(document.querySelectorAll('.mode-button'));

            const modeLabels = {
                summary: 'Document Summary',
                report: 'Professional Report',
                actions: 'Action Items',
                qa: 'Document Answer',
            };

            let selectedMode = 'summary';
            let generatedReportHtmlContent = null;

            function setMode(mode) {
                selectedMode = mode;
                modeButtons.forEach(button => {
                    button.classList.toggle('active', button.dataset.mode === mode);
                });
                questionGroup.classList.toggle('d-none', mode !== 'qa');
                outputTitle.textContent = modeLabels[mode] || 'Document output';
            }

            modeButtons.forEach(button => {
                button.addEventListener('click', () => setMode(button.dataset.mode));
            });

            fileUpload.addEventListener('change', () => {
                generatedReportHtmlContent = null;
                downloadReportButton.classList.add('d-none');
                const fileName = fileUpload.files[0] ? fileUpload.files[0].name : 'No file selected';
                outputMeta.textContent = fileName;
                reportOutput.innerHTML = '<p class="text-muted mb-0">Ready to analyze the selected document.</p>';
            });

            generateReportButton.addEventListener('click', async () => {
                const file = fileUpload.files[0];
                const userInstructions = userInstructionsInput.value.trim();
                const question = documentQuestion.value.trim();

                if (!file) {
                    alert('Please choose a document first.');
                    return;
                }
                if (selectedMode === 'qa' && !question) {
                    alert('Please enter a question for Ask Document mode.');
                    return;
                }

                reportOutput.innerHTML = '<div class="d-flex align-items-center"><strong role="status">Analyzing document...</strong><div class="spinner-border ms-auto" aria-hidden="true"></div></div>';
                outputTitle.textContent = modeLabels[selectedMode] || 'Document output';
                outputMeta.textContent = `${file.name} · ${modeLabels[selectedMode]}`;
                generateReportButton.disabled = true;
                downloadReportButton.classList.add('d-none');

                const formData = new FormData();
                formData.append('file', file);
                formData.append('analysis_mode', selectedMode);
                formData.append('user_instructions', userInstructions);
                formData.append('question', question);
                formData.append('add_to_knowledge_base', addToKnowledgeBase.checked ? 'true' : 'false');

                try {
                    const response = await fetch('/process_document_ocr', {
                        method: 'POST',
                        body: formData,
                    });

                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(result.error || response.statusText);
                    }

                    if (result.error) {
                        throw new Error(result.error);
                    }
                    if (!result.report_html) {
                        throw new Error('The server did not return document analysis content.');
                    }

                    reportOutput.innerHTML = result.report_html;
                    generatedReportHtmlContent = result.report_html;
                    const textLength = result.extracted_text_length ? `${result.extracted_text_length.toLocaleString()} characters extracted` : 'Document processed';
                    let knowledgeBaseStatus = '';
                    if (result.knowledge_base && result.knowledge_base.ok) {
                        knowledgeBaseStatus = ` · ${result.knowledge_base.chunk_count} chunks saved for chat`;
                    } else if (result.knowledge_base && !result.knowledge_base.ok) {
                        knowledgeBaseStatus = ' · knowledge base save skipped';
                    }
                    outputMeta.textContent = `${file.name} · ${modeLabels[result.analysis_mode] || modeLabels[selectedMode]} · ${textLength}${knowledgeBaseStatus}`;
                    downloadReportButton.classList.remove('d-none');
                } catch (error) {
                    console.error('Error analyzing document:', error);
                    reportOutput.innerHTML = `<p class="text-danger"><strong>Error:</strong> ${error.message}</p>`;
                    generatedReportHtmlContent = null;
                } finally {
                    generateReportButton.disabled = false;
                }
            });

            downloadReportButton.addEventListener('click', () => {
                if (!generatedReportHtmlContent) {
                    alert('There is no generated content to download.');
                    return;
                }
                const blob = new Blob([generatedReportHtmlContent], { type: 'text/html;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                const baseName = fileUpload.files[0] ? fileUpload.files[0].name.split('.')[0] : 'document';
                link.download = `${baseName}_${selectedMode}.html`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            });
        });
    </script>
</body>
</html>
