<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법률 상담 데스크 - 상담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%}
body{background:#f7f5f1;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#1f4b7a;text-decoration:none}
button{font:inherit;color:inherit}
textarea,input{font:inherit}
::selection{background:#e6f0f0}
@keyframes lpb{0%,100%{opacity:.2}50%{opacity:1}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#dcd8d0;border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<!-- Auth strip. Ported from the OIDC branch, whose sign-in controls lived in an
     inline server-rendered layout that main's lc-*.js shell replaced. Kept
     server-rendered so login state is correct on first paint. -->
<div id="auth-bar" style="display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:8px 16px;font:400 13px/1.4 'Noto Sans KR',system-ui,sans-serif;color:#5a5750;background:#f2efe9;border-bottom:1px solid #e2ddd3">
  {% if authenticated_account_email %}
    <span>{{ authenticated_account_email }}</span>
    <form action="{{ url_for('auth_logout') }}" method="post" style="margin:0">
      <button type="submit" style="background:none;border:1px solid #cfc9bd;border-radius:4px;padding:3px 10px;cursor:pointer">Sign out</button>
    </form>
  {% else %}
    <a href="{{ url_for('auth_login') }}" style="border:1px solid #cfc9bd;border-radius:4px;padding:3px 10px">Sign in with Google</a>
  {% endif %}
</div>
<div id="app"></div>

<script src="{{ url_for('static', filename='lc-data.js') }}"></script>
<script src="{{ url_for('static', filename='lc-shell.js') }}"></script>
<script src="{{ url_for('static', filename='lc-chat.js') }}"></script>
</body>
</html>
