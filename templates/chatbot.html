<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS_Agent - Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f6f7f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
            min-height: 0;
        }
        .app-shell {
            height: calc(100vh - 122px);
        }
        .function-bar .btn {
            margin-right: 0.5rem;
        }
        .chat-panel,
        .side-panel {
            height: 100%;
            min-height: 0;
        }
        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
        }
        .message {
            max-width: 86%;
            margin-bottom: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }
        .draft-card {
            flex: 7;
            min-height: 0;
        }
        .knowledge-card {
            flex: 2;
            min-height: 0;
        }
        .thoughts-card {
            flex: 2;
            min-height: 0;
        }
        #personalStatementDraft {
            flex: 1;
            min-height: 0;
            resize: none;
        }
        .knowledge-list,
        .thoughts-log {
            overflow-y: auto;
            font-size: 0.85rem;
        }
        .knowledge-list {
            max-height: 86px;
        }
        .thoughts-log {
            max-height: 96px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 0.5rem;
        }
        .source-row {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.2rem 0;
            border-bottom: 1px solid #e9ecef;
        }
        .source-row:last-child {
            border-bottom: 0;
        }
        @media (max-width: 767.98px) {
            .app-shell {
                height: auto;
            }
            .chat-panel,
            .side-panel {
                height: auto;
                min-height: 520px;
            }
        }
    </style>
</head>
<body>
    <header class="bg-light border-bottom py-3">
        <div class="container">
            <h1 class="h2 mb-3">PS_Agent Work Companion</h1>
            <div class="d-flex justify-content-end align-items-center mb-2">
                {% if authenticated_account_email %}
                    <span class="text-muted small me-2">{{ authenticated_account_email }}</span>
                    <form action="{{ url_for('auth_logout') }}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">Sign out</button>
                    </form>
                {% else %}
                    <a href="{{ url_for('auth_login', next=request.path) }}" class="btn btn-outline-primary btn-sm">Sign in with Google</a>
                {% endif %}
            </div>
            <div class="function-bar">
                <button class="btn btn-primary active"><i class="bi bi-chat"></i> Chat</button>
                <a href="document.html" class="btn btn-outline-primary"><i class="bi bi-file-text"></i> Documents</a>
                <a href="audio.html" class="btn btn-outline-primary"><i class="bi bi-mic"></i> Audio</a>
                <a href="statistics.html" class="btn btn-outline-primary"><i class="bi bi-bar-chart"></i> Statistics</a>
            </div>
        </div>
    </header>

    <main class="py-3">
        <div class="container app-shell">
            <div class="row g-3 h-100">
                <div class="col-md-5 h-100">
                    <section class="card chat-panel">
                        <div class="card-body d-flex flex-column">
                            <h2 class="h5">Chat</h2>
                            <div class="chat-messages" id="chatMessages"></div>
                            <div class="input-group mt-2">
                                <textarea id="userInput" class="form-control" placeholder="Ask for writing help, document follow-up, or web-search style information." rows="2"></textarea>
                                <button id="sendButton" class="btn btn-primary">Send</button>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="col-md-7 h-100">
                    <section class="side-panel d-flex flex-column gap-3">
                        <div class="card draft-card">
                            <div class="card-body d-flex flex-column">
                                <h2 class="h5 d-flex justify-content-between align-items-center">
                                    Draft
                                    <span id="savingIndicator" class="text-muted small">Saved</span>
                                </h2>
                                <textarea id="personalStatementDraft" class="form-control" placeholder="Write or paste your draft here."></textarea>
                            </div>
                        </div>

                        <div class="card knowledge-card">
                            <div class="card-body">
                                <h2 class="h5 d-flex justify-content-between align-items-center">
                                    Knowledge Base
                                    <span>
                                        <button id="refreshKnowledgeButton" class="btn btn-outline-secondary btn-sm" type="button" title="Refresh knowledge base">
                                            <i class="bi bi-arrow-clockwise"></i>
                                        </button>
                                        <button id="clearKnowledgeButton" class="btn btn-outline-danger btn-sm" type="button" title="Clear knowledge base">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </span>
                                </h2>
                                <div id="knowledgeSummary" class="text-muted small">Loading sources...</div>
                                <div id="knowledgeSources" class="knowledge-list"></div>
                            </div>
                        </div>

                        <div class="card thoughts-card">
                            <div class="card-body">
                                <h2 id="thoughtsHeader" class="h5" role="button" tabindex="0" aria-expanded="true" aria-controls="thoughtsLog">Agent Trace</h2>
                                <div class="thoughts-log" id="thoughtsLog" aria-hidden="false"></div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const personalStatementDraft = document.getElementById('personalStatementDraft');
        const thoughtsLog = document.getElementById('thoughtsLog');
        const savingIndicator = document.getElementById('savingIndicator');
        const thoughtsHeader = document.getElementById('thoughtsHeader');
        const refreshKnowledgeButton = document.getElementById('refreshKnowledgeButton');
        const clearKnowledgeButton = document.getElementById('clearKnowledgeButton');
        const knowledgeSummary = document.getElementById('knowledgeSummary');
        const knowledgeSources = document.getElementById('knowledgeSources');

        let tempMessageDiv = null;
        let source = null;
        let streamedAssistantText = "";
        let draftSaveTimeout;

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = `${userInput.scrollHeight}px`;
        });

        personalStatementDraft.addEventListener('input', () => {
            savingIndicator.textContent = 'Saving...';
            clearTimeout(draftSaveTimeout);
            draftSaveTimeout = setTimeout(saveDraft, 800);
        });

        async function saveDraft() {
            try {
                const response = await fetch('/update_statement', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        personal_statement_draft: personalStatementDraft.value || ''
                    })
                });
                if (!response.ok) {
                    throw new Error(`Save failed: ${response.statusText}`);
                }
                savingIndicator.textContent = 'Saved';
            } catch (error) {
                console.error('Draft save error:', error);
                savingIndicator.textContent = 'Save error';
            }
        }

        function toggleCollapse(targetId, buttonElement) {
            const targetElement = document.getElementById(targetId);
            if (!targetElement || !buttonElement) return;
            targetElement.classList.toggle('d-none');
            const isHidden = targetElement.classList.contains('d-none');
            buttonElement.setAttribute('aria-expanded', String(!isHidden));
            targetElement.setAttribute('aria-hidden', String(isHidden));
        }

        function addMessage(role, content, isThought = false) {
            const messageDiv = document.createElement('div');
            if (isThought) {
                const preElement = document.createElement('pre');
                preElement.classList.add('small', 'mb-0');
                preElement.textContent = content;
                messageDiv.appendChild(preElement);
                thoughtsLog.appendChild(messageDiv);
                thoughtsLog.scrollTop = thoughtsLog.scrollHeight;
                return;
            }

            const finalContent = content && content.startsWith('AI: ') ? content.slice(4).trim() : content;
            if (role === 'assistant' && tempMessageDiv) {
                tempMessageDiv.textContent += finalContent;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return;
            }

            messageDiv.classList.add(
                'message',
                role === 'user' ? 'bg-primary-subtle' : 'bg-light',
                role === 'user' ? 'ms-auto' : 'me-auto'
            );
            messageDiv.textContent = finalContent;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            tempMessageDiv = role === 'assistant' ? messageDiv : null;
        }

        async function fetchKnowledgeBaseStatus() {
            try {
                const response = await fetch('/knowledge_base/status');
                if (!response.ok) {
                    throw new Error(`Knowledge base status failed: ${response.statusText}`);
                }
                const status = await response.json();
                const sources = Array.isArray(status.sources) ? status.sources : [];
                knowledgeSummary.textContent = status.chunk_count
                    ? `${status.chunk_count} chunks from ${sources.length} source${sources.length === 1 ? '' : 's'}`
                    : 'No saved document sources yet.';
                knowledgeSources.innerHTML = '';
                sources.forEach(sourceInfo => {
                    const row = document.createElement('div');
                    row.className = 'source-row';
                    const name = document.createElement('span');
                    name.textContent = sourceInfo.source || 'Unknown source';
                    const count = document.createElement('span');
                    count.className = 'text-muted';
                    count.textContent = `${sourceInfo.chunk_count || 0}`;
                    row.appendChild(name);
                    row.appendChild(count);
                    knowledgeSources.appendChild(row);
                });
                if (status.error) {
                    knowledgeSummary.textContent = `Knowledge base status error: ${status.error}`;
                }
            } catch (error) {
                console.error('Knowledge base status error:', error);
                knowledgeSummary.textContent = 'Could not load knowledge base status.';
            }
        }

        async function clearKnowledgeBase() {
            if (!confirm('Clear all saved document chunks from the chat knowledge base?')) return;
            clearKnowledgeButton.disabled = true;
            try {
                const response = await fetch('/knowledge_base/clear', { method: 'POST' });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.ok) {
                    throw new Error(result.message || response.statusText);
                }
                knowledgeSummary.textContent = result.message || 'Knowledge base cleared.';
                knowledgeSources.innerHTML = '';
                fetchKnowledgeBaseStatus();
            } catch (error) {
                console.error('Knowledge base clear error:', error);
                knowledgeSummary.textContent = `Could not clear knowledge base: ${error.message}`;
            } finally {
                clearKnowledgeButton.disabled = false;
            }
        }

        async function fetchInitialState() {
            try {
                const response = await fetch('/get_initial_state');
                if (!response.ok) {
                    throw new Error(`Initial state failed: ${response.statusText}`);
                }
                const state = await response.json();
                personalStatementDraft.value = state.personal_statement_draft || '';
                chatMessages.innerHTML = '';
                if (Array.isArray(state.chat_history) && state.chat_history.length > 0) {
                    state.chat_history.forEach(message => addMessage(message.role, message.content));
                } else {
                    addMessage('assistant', 'Hello. I can help with writing, document follow-up questions, and information search.');
                }
            } catch (error) {
                console.error('Initial state error:', error);
                addMessage('assistant', 'An error occurred while loading the initial state. Please refresh.');
            }
            fetchKnowledgeBaseStatus();
        }

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (!messageText) return;

            addMessage('user', messageText);
            userInput.value = '';
            userInput.style.height = 'auto';
            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';
            streamedAssistantText = "";
            tempMessageDiv = null;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: messageText,
                        personal_statement_draft: personalStatementDraft.value || ''
                    })
                });
                if (!response.ok) {
                    throw new Error(`Server response error: ${response.statusText}`);
                }

                if (source) source.close();
                const queryParams = new URLSearchParams({
                    message: messageText,
                    personal_statement_draft: personalStatementDraft.value || ''
                });
                source = new EventSource(`/chat?${queryParams.toString()}`);

                source.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'token_chunk') {
                            streamedAssistantText += data.content;
                            addMessage('assistant', data.content);
                        } else if (data.type === 'thought') {
                            addMessage('assistant', data.content, true);
                        } else if (data.type === 'final_response') {
                            if (streamedAssistantText.trim()) {
                                if (tempMessageDiv) {
                                    tempMessageDiv.textContent = data.chat_response || streamedAssistantText;
                                }
                            } else {
                                addMessage('assistant', data.chat_response);
                            }
                            tempMessageDiv = null;
                            streamedAssistantText = "";
                            if (data.statement_suggestion) addMessage('assistant', `Personal statement suggestion:\n${data.statement_suggestion}`);
                            if (data.job_statement_suggestion) addMessage('assistant', `Job application suggestion:\n${data.job_statement_suggestion}`);
                            if (data.report_suggestion) addMessage('assistant', `Report suggestion:\n${data.report_suggestion}`);
                            source.close();
                        } else if (data.type === 'update_draft') {
                            personalStatementDraft.value = data.content;
                            personalStatementDraft.dispatchEvent(new Event('input', { bubbles: true }));
                            source.close();
                        } else if (data.type === 'error') {
                            addMessage('assistant', `Error: ${data.content}`);
                            source.close();
                        } else if (data.type === 'stream_end') {
                            source.close();
                        }
                    } catch (error) {
                        console.error('SSE parse error:', error);
                        addMessage('assistant', 'A response parsing error occurred.');
                    }
                };

                source.onerror = function() {
                    addMessage('assistant', 'Server connection failed.');
                    source.close();
                };
            } catch (error) {
                console.error('Message send error:', error);
                addMessage('assistant', 'An error occurred while sending the message.');
                if (source) source.close();
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = 'Send';
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        thoughtsHeader.addEventListener('click', () => toggleCollapse('thoughtsLog', thoughtsHeader));
        thoughtsHeader.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleCollapse('thoughtsLog', thoughtsHeader);
            }
        });
        refreshKnowledgeButton.addEventListener('click', fetchKnowledgeBaseStatus);
        clearKnowledgeButton.addEventListener('click', clearKnowledgeBase);
        document.addEventListener('DOMContentLoaded', fetchInitialState);
    </script>
</body>
</html>
