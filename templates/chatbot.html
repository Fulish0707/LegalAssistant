<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 도우미</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            flex-shrink: 0;
        }
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            max-height: calc(100vh - 60px); /* Header ~60px with py-2 */
        }
        .container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .row {
            flex-grow: 1;
            display: flex;
            height: 100%;
            flex-wrap: nowrap;
        }
        .col-md-left {
            flex: 4; /* 40% width */
            max-width: 40%;
            display: flex;
        }
        .col-md-right {
            flex: 6; /* 60% width */
            max-width: 60%;
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .draft-container {
            flex: 10; /* Adjusted to balance thoughts-container increase */
            max-height: calc(80% - 12px); /* Adjust for 15px margin-bottom */
            margin-bottom: 20px; /* 15px gap to thoughts-container */
        }
        .thoughts-container {
            flex: 2; /* Increased to accommodate larger thoughts-log */
            max-height: calc(20% - 3px); /* Adjust for 15px margin */
            margin-bottom: 1.5rem; /* mb-3 */
        }
        .chat-container .card-body, .draft-container .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            max-height: 100%;
            padding: 1rem;
        }
        .thoughts-container .card-body {
            max-height: 100%;
            padding: 1rem;
        }
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 1rem;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            min-height: 0;
        }
        .chat-input {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 0.5rem;
            border-top: 1px solid #dee2e6;
            flex-shrink: 0;
        }
        .message {
            max-width: 85%;
            margin-bottom: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .thoughts-log {
            max-height: 90px; /* Increased for ~4-5 lines */
            overflow-y: auto;
            padding: 2rem;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            font-size: 0.85rem;
        }
        .saving-indicator.saving {
            opacity: 1;
        }
        .function-bar .btn {
            margin-right: 0.5rem;
        }
        .draft-container textarea {
            flex-grow: 1;
            min-height: 0;
            resize: none;
        }
        @media (max-width: 767.98px) {
            .col-md-left, .col-md-right {
                flex: 0 0 100%;
                max-width: 100%;
            }
            .chat-container {
                max-height: calc(50vh - 60px);
            }
            .draft-container {
                flex: 7.5;
                max-height: calc(80% - 12px); /* Adjust for 15px margin */
                margin-bottom: 15px; /* 15px gap */
            }
            .thoughts-container {
                flex: 2.5;
                max-height: calc(20% - 3px);
                margin-bottom: 1rem; /* mb-3 */
            }
            .chat-container .card-body, .draft-container .card-body {
                max-height: 100%;
                padding: 1rem;
            }
            .thoughts-container .card-body {
                max-height: 100%;
                padding: 1rem;
            }
            .thoughts-log {
                max-height: 80px; /* Increased for ~4-5 lines */
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header class="bg-light border-bottom py-3">
        <div class="container">
            <h1 class="h2 mb-3">무엇을 도와드릴까요?</h1>
            <div class="function-bar">
                <button class="btn btn-primary active"><i class="bi bi-chat"></i> 작성</button>
                <a href="document.html" class="btn btn-outline-primary"><i class="bi bi-file-text"></i> 문서</a>
                <a href="audio.html" class="btn btn-outline-primary"><i class="bi bi-mic"></i> 음성</a>
                <!-- <a href="javascript:void(0);" class="btn btn-outline-primary"><i class="bi bi-camera-reels"></i> 영상</a> -->
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="flex-grow-1 py-3">
        <div class="container h-100">
            <div class="row">
                <div class="col-md-left mb-4 d-flex">
                    <div class="card chat-container w-100" id="chat-container">
                        <div class="card-body d-flex flex-column">
                            <h2 class="card-title h5">Chat With Me</h2>
                            <div class="chat-messages" id="chatMessages"></div>
                            <div class="chat-input mt-2">
                                <div class="input-group mt-1">
                                    <textarea id="userInput" class="form-control" placeholder="메시지를 입력하세요..." rows="2"></textarea>
                                    <button id="sendButton" class="btn btn-primary">전송</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-right mb-0 d-flex flex-column">
                    <div class="card draft-container" id="draft-container">
                        <div class="card-body d-flex flex-column">
                            <h2 class="card-title h5 d-flex justify-content-between align-items-center">
                                초안 작성
                                <span id="savingIndicator" class="saving-indicator opacity-0 text-muted small">저장됨</span>
                            </h2>
                            <textarea id="personalStatementDraft" class="form-control" placeholder="초안을 작성하세요..."></textarea>
                        </div>
                    </div>
                    <div class="card thoughts-container mb-" id="thoughts-container">
                        <div class="card-body">
                            <h2 id="thoughtsHeader" class="card-title h5 collapsible-header" role="button" tabindex="0" aria-expanded="true" aria-controls="thoughtsLog">에이전트 생각</h2>
                            <div class="thoughts-log" id="thoughtsLog" aria-hidden="false"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const personalStatementDraft = document.getElementById('personalStatementDraft');
        const thoughtsLog = document.getElementById('thoughtsLog');
        const savingIndicator = document.getElementById('savingIndicator');
        const thoughtsHeader = document.getElementById('thoughtsHeader');

        let tempMessageDiv = null; // token_chunk 누적용
        let source = null; // 단일 EventSource 재사용

        // 자동 높이 조정
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = `${userInput.scrollHeight}px`;
        });

        // 드래프트 저장
        let draftSaveTimeout;
        personalStatementDraft.addEventListener('input', () => {
            savingIndicator.textContent = '저장 중...';
            savingIndicator.classList.add('saving');
            clearTimeout(draftSaveTimeout);
            draftSaveTimeout = setTimeout(async () => {
                try {
                    await new Promise(resolve => setTimeout(resolve, 500)); // 모의 저장
                    savingIndicator.textContent = '저장됨';
                    savingIndicator.classList.remove('saving');
                } catch (error) {
                    console.error('초안 저장 오류:', error);
                    savingIndicator.textContent = '저장 오류';
                }
            }, 1000);
        });

        // 토글 기능
        function toggleCollapse(targetId, buttonElement) {
            const targetElement = document.getElementById(targetId);
            if (!targetElement || !buttonElement) return;
            targetElement.classList.toggle('d-none');
            const isHidden = targetElement.classList.contains('d-none');
            buttonElement.setAttribute('aria-expanded', !isHidden);
            targetElement.setAttribute('aria-hidden', isHidden);
        }

        // 메시지 추가
        function addMessage(role, content, isThought = false) {
            const messageDiv = document.createElement('div');
            if (isThought && !content.startsWith('AI: ')) {
                // thought 메시지이지만 AI: 로 시작하지 않으면 thoughtsLog에 추가
                if (thoughtsLog.classList.contains('d-none')) {
                    toggleCollapse('thoughtsLog', thoughtsHeader); // thoughtsLog 표시
                }
                const preElement = document.createElement('pre');
                preElement.classList.add('small', 'mb-0');
                preElement.textContent = content;
                messageDiv.appendChild(preElement);
                thoughtsLog.appendChild(messageDiv);
                thoughtsLog.scrollTop = thoughtsLog.scrollHeight;
                console.log('Thought added to thoughtsLog:', content); // 디버깅
            } else {
                // AI: 로 시작하는 thought 또는 다른 메시지는 chatMessages에 추가
                const finalContent = content.startsWith('AI: ') ? content.slice(4).trim() : content; // AI: 접두어 제거
                if (role === 'assistant' && tempMessageDiv) {
                    tempMessageDiv.textContent += finalContent; // token_chunk 누적
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } else {
                    messageDiv.classList.add('message', role === 'user' ? 'bg-primary-subtle' : 'bg-light', 'p-2', 'rounded', 'mb-2', role === 'user' ? 'ms-auto' : 'me-auto');
                    messageDiv.textContent = finalContent;
                    chatMessages.appendChild(messageDiv);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    if (role === 'assistant') tempMessageDiv = messageDiv; // 새 assistant 메시지 시작
                    else tempMessageDiv = null; // user 메시지 후 초기화
                }
                console.log(`${role || 'thought'} message added to chatMessages:`, finalContent); // 디버깅
            }
        }

        // 초기 상태 로드
        async function fetchInitialState() {
            try {
                addMessage('assistant', '안녕하세요! 어떻게 도와드릴까요?');
            } catch (error) {
                console.error('초기 상태 로드 오류:', error);
                addMessage('assistant', '오류가 발생했습니다. 새로고침해 주세요.');
            }
        }

        // 메시지 전송
        async function sendMessage() {
            if (!userInput) return;
            const messageText = userInput.value.trim();
            if (!messageText) return;

            addMessage('user', messageText);
            userInput.value = '';
            userInput.style.height = 'auto';
            sendButton.disabled = true;
            sendButton.textContent = '전송 중...';
            sendButton.classList.add('opacity-50');

            try {
                // POST 요청
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: messageText,
                        personal_statement_draft: personalStatementDraft.value || ''
                    })
                });

                if (!response.ok) {
                    throw new Error(`서버 응답 오류: ${response.statusText}`);
                }

                // 기존 EventSource 종료
                if (source) {
                    source.close();
                    console.log('Previous EventSource closed');
                }

                // 새 EventSource 연결 (Query Parameters 추가)
                const queryParams = new URLSearchParams({
                    message: messageText,
                    personal_statement_draft: personalStatementDraft.value || ''
                });
                source = new EventSource(`/chat?${queryParams.toString()}`);
                console.log(`EventSource connected to /chat?${queryParams.toString()}`);

                source.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('SSE event received:', data); // 디버깅

                        if (data.type === 'token_chunk') {
                            addMessage('assistant', data.content); // 점진적 업데이트
                        } else if (data.type === 'thought') {
                            addMessage('assistant', data.content, true); // Correctly indicate this is a thought
                        } else if (data.type === 'final_response') {
                            tempMessageDiv = null; // token_chunk 누적 종료
                            addMessage('assistant', data.chat_response);
                            if (data.statement_suggestion) {
                                addMessage('assistant', `제안: ${data.statement_suggestion}`);
                            }
                            source.close();
                            console.log('EventSource closed after final_response');
                        } else if (data.type === 'error') {
                            addMessage('assistant', `오류: ${data.content}`);
                            source.close();
                        } else if (data.type === 'stream_end') {
                            source.close();
                            console.log('EventSource closed after stream_end');
                        } else {
                            console.warn('Unknown SSE event type:', data.type);
                        }
                    } catch (error) {
                        console.error('SSE 데이터 파싱 오류:', error);
                        addMessage('assistant', '데이터 처리 오류가 발생했습니다.');
                    }
                };

                source.onerror = function() {
                    console.error('SSE 연결 오류');
                    addMessage('assistant', '서버 연결에 실패했습니다.');
                    source.close();
                };
            } catch (error) {
                console.error('메시지 전송 오류:', error);
                addMessage('assistant', '오류가 발생했습니다.');
                if (source) source.close();
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = '전송';
                sendButton.classList.remove('opacity-50');
            }
        }

        // 이벤트 리스너
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        if (thoughtsHeader) {
            thoughtsHeader.addEventListener('click', () => toggleCollapse('thoughtsLog', thoughtsHeader));
            thoughtsHeader.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    toggleCollapse('thoughtsLog', thoughtsHeader);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', fetchInitialState);
    </script>
</body>
</html>
